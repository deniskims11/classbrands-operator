name: Refresh and deploy

# Pulls every client's numbers from Triple Whale, builds the dashboard data,
# encrypts it with DASHBOARD_PASSWORD and publishes to GitHub Pages.
# Data is never committed; only the encrypted copy is published.
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 */3 * * *'   # about every 3 hours
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet cryptography

      - name: Check secrets
        env:
          TW_API_KEY: ${{ secrets.TW_API_KEY }}
          TW_API_KEYS: ${{ secrets.TW_API_KEYS }}
          CBO_CONFIG: ${{ secrets.CBO_CONFIG }}
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
        run: |
          missing=""
          [ -z "$TW_API_KEY$TW_API_KEYS" ] && missing="$missing TW_API_KEYS"
          [ -z "$CBO_CONFIG" ] && missing="$missing CBO_CONFIG"
          [ -z "$DASHBOARD_PASSWORD" ] && missing="$missing DASHBOARD_PASSWORD"
          if [ -n "$missing" ]; then echo "::error::Missing repo secrets:$missing"; exit 1; fi

      - name: Pull data from Triple Whale
        env:
          TW_API_KEY: ${{ secrets.TW_API_KEY }}
          TW_API_KEYS: ${{ secrets.TW_API_KEYS }}
          CBO_CONFIG: ${{ secrets.CBO_CONFIG }}
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
        run: python3 scripts/fetch_tw.py

      - name: Build
        env:
          CBO_CONFIG: ${{ secrets.CBO_CONFIG }}
        run: python3 scripts/build.py

      - name: Pull each brand's full dashboard data
        env:
          TW_API_KEY: ${{ secrets.TW_API_KEY }}
          TW_API_KEYS: ${{ secrets.TW_API_KEYS }}
          CBO_CONFIG: ${{ secrets.CBO_CONFIG }}
        run: python3 scripts/brand_data.py

      - name: Encrypt
        env:
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
        run: python3 scripts/encrypt_data.py

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build the brand dashboard app
        working-directory: brand
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Copy the app into each brand's folder
        run: for d in public/b/*/; do cp -R brand/dist/. "$d"; done

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
